<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link id="dynamic-favicon" rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Dashboard - Yinglima</title>
  <script>
    (function() {
      try {
        var c = localStorage.getItem("erp_org_company_name") || localStorage.getItem("erp_brand_name") || sessionStorage.getItem("erp_org_company_name") || "Yinglima";
        var company = c.trim();
        var path = window.location.pathname.replace(/^\/|\/$/g, "");
        var page = "Dashboard";
        if (path === "buyers") page = "Buyers";
        else if (path === "suppliers") page = "Suppliers";
        else if (path === "inquiries") page = "Inquiries";
        else if (path === "organization") page = "Organization Settings";
        else if (path && path !== "dashboard" && path !== "login") {
          page = path.charAt(0).toUpperCase() + path.slice(1).replace(/[-_]/g, " ");
        }
        document.title = page + " - " + company;
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
