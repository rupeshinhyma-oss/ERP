services:
  # -----------------------------------------------------------------------------
  # Yinglima ERP Backend (FastAPI Web Service)
  # -----------------------------------------------------------------------------
  - type: web
    name: yinglima-erp-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-reload --workers 4
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MEMBER_PASSWORD_ENCRYPTION_KEY
        generateValue: true
      - key: ERP_MAIN_SERVICE_CREDENTIAL
        sync: false
      - key: AUTH_USE_SECURE_COOKIES
        value: true

  # -----------------------------------------------------------------------------
  # Yinglima ERP Frontend (Vite React Static Site)
  # -----------------------------------------------------------------------------
  - type: web
    name: yinglima-erp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        sync: false
      - key: VITE_CONTROL_PLANE_URL
        sync: false
      - key: VITE_CENTRAL_AUTH_API
        sync: false
      - key: VITE_COOKIE_DOMAIN
        sync: false
