<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .actor-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
      .actor-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; text-anchor: middle; fill: #e2e8f0; }
      .step-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .step-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .step-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #475569; }
      .note-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #1e40af; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea" />
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#f8fafc" rx="10" />

  <!-- Header -->
  <rect x="25" y="20" width="950" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)" />
  <text x="45" y="44" class="title">Cross-Border Commercial &amp; Financial Sequence Lifecycle</text>
  <text x="45" y="60" class="sub">Chronological interaction from overseas container demand to Chinese factory billing, customs export and sync</text>

  <!-- Lifeline Columns -->
  <!-- 1: Buyer (x=100) -->
  <line x1="100" y1="130" x2="100" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="25" y="90" width="150" height="42" rx="6" fill="#1e3a8a" filter="url(#shadow)" />
  <text x="100" y="108" class="actor-title">Overseas Buyer</text>
  <text x="100" y="122" class="actor-sub">(e.g. Inhyma India)</text>

  <!-- 2: Shipment Planning (x=270) -->
  <line x1="270" y1="130" x2="270" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="195" y="90" width="150" height="42" rx="6" fill="#ca8a04" filter="url(#shadow)" />
  <text x="270" y="108" class="actor-title">Shipment Planning</text>
  <text x="270" y="122" class="actor-sub">(Container CBM Matrix)</text>

  <!-- 3: Local Purchase (x=450) -->
  <line x1="450" y1="130" x2="450" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="375" y="90" width="150" height="42" rx="6" fill="#2563eb" filter="url(#shadow)" />
  <text x="450" y="108" class="actor-title">Local Purchase</text>
  <text x="450" y="122" class="actor-sub">(Domestic RMB Orders)</text>

  <!-- 4: Factory / Supplier (x=630) -->
  <line x1="630" y1="130" x2="630" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="555" y="90" width="150" height="42" rx="6" fill="#475569" filter="url(#shadow)" />
  <text x="630" y="108" class="actor-title">China Factory</text>
  <text x="630" y="122" class="actor-sub">(Dingye / Prathamesh)</text>

  <!-- 5: Sale Process (x=800) -->
  <line x1="800" y1="130" x2="800" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="725" y="90" width="150" height="42" rx="6" fill="#16a34a" filter="url(#shadow)" />
  <text x="800" y="108" class="actor-title">Sale Process</text>
  <text x="800" y="122" class="actor-sub">(16-Column CI Engine)</text>

  <!-- 6: India Customs / ERP (x=930) -->
  <line x1="930" y1="130" x2="930" y2="640" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="870" y="90" width="120" height="42" rx="6" fill="#9333ea" filter="url(#shadow)" />
  <text x="930" y="108" class="actor-title">Inhyma ERP</text>
  <text x="930" y="122" class="actor-sub">(India Custom)</text>

  <!-- STEP 1: Buyer -> Planning (y=160) -->
  <circle cx="100" cy="160" r="10" fill="#2563eb" />
  <text x="100" y="164" class="step-num">1</text>
  <line x1="110" y1="160" x2="260" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="120" y="152" class="step-text">Place planned items into container column (e.g. Mum 48)</text>

  <!-- STEP 2: Planning -> Local Purchase (y=210) -->
  <circle cx="270" cy="210" r="10" fill="#2563eb" />
  <text x="270" y="214" class="step-num">2</text>
  <line x1="280" y1="210" x2="440" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="290" y="202" class="step-text">Consignment items become available for procurement</text>

  <!-- NOTE ON LOCAL PURCHASE (y=245) -->
  <rect x="360" y="235" width="220" height="45" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="370" y="250" class="note-text" font-weight="700">Filter by Supplier (e.g. Prathamesh)</text>
  <text x="370" y="268" class="note-text">Loads only that factory's planned products</text>

  <!-- STEP 3: Local Purchase -> Supplier (y=305) -->
  <circle cx="450" cy="305" r="10" fill="#2563eb" />
  <text x="450" y="309" class="step-num">3</text>
  <line x1="460" y1="305" x2="620" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="470" y="297" class="step-text">Issue Local Purchase Order in RMB (¥)</text>

  <!-- STEP 4: Supplier -> Local Purchase (y=350) -->
  <circle cx="630" cy="350" r="10" fill="#16a34a" />
  <text x="630" y="354" class="step-num">4</text>
  <line x1="620" y1="350" x2="460" y2="350" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#m-green)" />
  <text x="470" y="342" class="step-text" fill="#16a34a">Factory delivers cargo to transit warehouse &amp; provides bill</text>

  <!-- NOTE ON FINANCIAL RECONCILIATION (y=385) -->
  <rect x="340" y="375" width="280" height="50" rx="5" fill="#f0fdf4" stroke="#86efac" />
  <text x="350" y="392" class="note-text" fill="#15803d" font-weight="700">Enter Landing Expenses &amp; HSN Purchase VAT (0%/13%)</text>
  <text x="350" y="410" class="note-text" fill="#15803d">Enforce Δ &le; 0.05 match &rarr; Confirm Local Purchase</text>

  <!-- STEP 5: Planning -> Sale Process (y=445) -->
  <circle cx="270" cy="445" r="10" fill="#2563eb" />
  <text x="270" y="449" class="step-num">5</text>
  <line x1="280" y1="445" x2="790" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="420" y="437" class="step-text">Transfer confirmed container consignment to Sale Process</text>

  <!-- STEP 6: Local Purchase -> Sale Process (y=490) -->
  <circle cx="450" cy="490" r="10" fill="#16a34a" />
  <text x="450" y="494" class="step-num">6</text>
  <line x1="460" y1="490" x2="790" y2="490" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)" />
  <text x="500" y="482" class="step-text" fill="#16a34a">Auto-source exact factory RMB purchase costs &amp; supplier name</text>

  <!-- NOTE ON 16-COL CI ENGINE (y=520) -->
  <rect x="680" y="510" width="250" height="50" rx="5" fill="#fefce8" stroke="#ca8a04" />
  <text x="690" y="527" class="note-text" fill="#854d0e" font-weight="700">16-Column CI Engine Calculates:</text>
  <text x="690" y="545" class="note-text" fill="#854d0e">13% VAT Refund, Ocean Freight/CBM, FOB/CFR USD Selling</text>

  <!-- STEP 7: Sale Process -> Buyer (y=580) -->
  <circle cx="800" cy="580" r="10" fill="#1e3a8a" />
  <text x="800" y="584" class="step-num">7</text>
  <line x1="790" y1="580" x2="110" y2="580" stroke="#1e3a8a" stroke-width="2" marker-end="url(#m-arrow)" />
  <text x="320" y="572" class="step-text" fill="#1e3a8a">Issue Official Commercial Invoice &amp; Packing List in USD ($)</text>

  <!-- STEP 8: Sale Process -> Inhyma ERP (y=620) -->
  <circle cx="800" cy="620" r="10" fill="#9333ea" />
  <text x="800" y="624" class="step-num">8</text>
  <line x1="810" y1="620" x2="920" y2="620" stroke="#9333ea" stroke-width="2" marker-end="url(#m-purple)" />
  <text x="820" y="612" class="step-text" fill="#9333ea">Outbox sync</text>
</svg>
