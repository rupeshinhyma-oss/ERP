name: Multi-ERP Ecosystem CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Configuration & Security Audits
  # ---------------------------------------------------------------------------
  config-and-security:
    name: Configuration & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Staging/Production Configurations
        run: |
          python scripts/validate_production_config.py --env staging

      - name: Check for Accidentally Committed Secrets
        run: |
          echo "Scanning repository for plain production secrets and private keys..."
          python scripts/scan_repository_secrets.py

  # ---------------------------------------------------------------------------
  # 2. Database Migration Chain Validation
  # ---------------------------------------------------------------------------
  migration-integrity:
    name: Alembic Migration Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify ERP_Main Alembic Head
        run: |
          cd ERP_Main/backend
          pip install -r requirements.txt
          alembic heads
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: ERP_Main has multiple migration heads!"
            exit 1
          fi

      - name: Verify Yinglima_ERP Alembic Head
        run: |
          cd Yinglima_ERP/backend
          pip install -r requirements.txt
          alembic heads
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: Yinglima_ERP has multiple migration heads!"
            exit 1
          fi

      - name: Verify Inhyma_ERP Alembic Head
        run: |
          cd Inhyma_ERP/backend
          pip install -r requirements.txt
          alembic heads
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: Inhyma_ERP has multiple migration heads!"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. Backend Test Suites (Matrix Execution)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ERP_Main, Yinglima_ERP, Inhyma_ERP]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "${{ matrix.project }}/backend/requirements.txt"

      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}/backend
          pip install --upgrade pip
          pip install -r requirements.txt pytest-asyncio

      - name: Migrate Database Schema
        env:
          DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@localhost:5432/erp_db
          DIRECT_URL: postgresql://erp_user:erp_password@localhost:5432/erp_db
        run: |
          cd ${{ matrix.project }}/backend
          alembic upgrade head || true

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@localhost:5432/erp_db
          DIRECT_URL: postgresql://erp_user:erp_password@localhost:5432/erp_db
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          PLATFORM_JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          SERVICE_CREDENTIAL_PEPPER: test-secret-pepper-that-is-at-least-32-chars
        run: |
          cd ${{ matrix.project }}/backend
          pytest -v

  # ---------------------------------------------------------------------------
  # 4. Frontend Production Builds (Matrix Execution)
  # ---------------------------------------------------------------------------
  frontend-builds:
    name: Frontend Production Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ERP_Main, Yinglima_ERP, Inhyma_ERP]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd ${{ matrix.project }}/frontend
          npm ci || npm install

      - name: Run Frontend Tests
        run: |
          cd ${{ matrix.project }}/frontend
          npm test -- --run

      - name: Build Production Assets
        run: |
          cd ${{ matrix.project }}/frontend
          npm run build
