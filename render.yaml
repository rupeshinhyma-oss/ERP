services:
  # =============================================================================
  # 1. ERP_Main (Global Control Plane)
  # =============================================================================
  - type: web
    name: erp-main-backend
    env: python
    rootDir: ERP_Main/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-reload --workers 2
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PLATFORM_JWT_SECRET_KEY
        generateValue: true
      - key: SERVICE_CREDENTIAL_PEPPER
        generateValue: true
      - key: YINGLIMA_API_URL
        sync: false
      - key: INHYMA_API_URL
        sync: false

  - type: web
    name: erp-main-frontend
    env: static
    rootDir: ERP_Main/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_ORIGIN
        sync: false
      - key: VITE_CONTROL_PLANE_URL
        sync: false
      - key: VITE_CENTRAL_AUTH_API
        sync: false
      - key: VITE_COOKIE_DOMAIN
        sync: false
      - key: VITE_YINGLIMA_URL
        sync: false
      - key: VITE_INHYMA_URL
        sync: false

